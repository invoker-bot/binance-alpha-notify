[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binance-alpha-notify"
version = "0.1.0"
description = "Binance Alpha 空投通知 CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Qingrui Hu" }]
dependencies = [
    "requests>=2.31.0",
    "apprise>=1.7.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
alpha-notify = "alpha_notify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_notify"]
